<!DOCTYPE html>
<html>
<head>
    <title>Leonard Game</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #88ccee;
            border: 3px solid #000;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
// =========================
// Canvas Setup
// =========================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 600;

// =========================
// Load Images
// =========================
const leonardIdle = new Image();
leonardIdle.src = "images/leonardidle.png";

const leonardLeft = new Image();
leonardLeft.src = "images/leonardleft.png";

const leonardRight = new Image();
leonardRight.src = "images/leonardright.png";

const deerLeft = new Image();
deerLeft.src = "images/deerleft.png";

const deerRight = new Image();
deerRight.src = "images/deerright.png";

const boarLeft = new Image();
boarLeft.src = "images/boarleft.png";

const boarRight = new Image();
boarRight.src = "images/boarright.png";

// =========================
// Player (Leonard)
// =========================
const player = {
    x: 200,
    y: 300,
    speed: 3,
    direction: "idle", // idle, left, right
    width: 40,
    height: 40
};

// =========================
// Animals (Boar + Deer)
// =========================
let animals = [];

function spawnAnimal(type) {
    const facing = Math.random() < 0.5 ? "left" : "right";

    animals.push({
        type: type, // "boar" or "deer"
        x: facing === "left" ? canvas.width + 50 : -50,
        y: 300 + Math.random() * 100 - 50,
        speed: type === "boar" ? 2.5 : 2,
        facing: facing,
        width: 40,
        height: 40
    });
}

// Spawn loop
setInterval(() => {
    const roll = Math.random();
    if (roll < 0.33) spawnAnimal("boar");
    else if (roll < 0.66) spawnAnimal("deer");
}, 2000);

// =========================
// Input
// =========================
let keys = {};

document.addEventListener("keydown", (e) => {
    keys[e.key] = true;
});

document.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

// =========================
// Update Player
// =========================
function updatePlayer() {
    if (keys["ArrowLeft"]) {
        player.x -= player.speed;
        player.direction = "left";
    } else if (keys["ArrowRight"]) {
        player.x += player.speed;
        player.direction = "right";
    } else {
        player.direction = "idle";
    }
}

// =========================
// Update Animals
// =========================
function updateAnimals() {
    animals.forEach((a) => {
        if (a.facing === "left") a.x -= a.speed;
        else a.x += a.speed;
    });

    // Remove off-screen animals
    animals = animals.filter(a => a.x > -100 && a.x < canvas.width + 100);
}

// =========================
// Draw Player
// =========================
function drawPlayer() {
    if (player.direction === "left") {
        ctx.drawImage(leonardLeft, player.x, player.y);
    } else if (player.direction === "right") {
        ctx.drawImage(leonardRight, player.x, player.y);
    } else {
        ctx.drawImage(leonardIdle, player.x, player.y);
    }
}

// =========================
// Draw Animals
// =========================
function drawAnimals() {
    animals.forEach((a) => {
        let img;

        if (a.type === "boar") {
            img = a.facing === "left" ? boarLeft : boarRight;
        } else if (a.type === "deer") {
            img = a.facing === "left" ? deerLeft : deerRight;
        }

        ctx.drawImage(img, a.x, a.y);
    });
}

// =========================
// Game Loop
// =========================
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updatePlayer();
    updateAnimals();

    drawPlayer();
    drawAnimals();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
