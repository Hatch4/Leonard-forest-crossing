<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Leonard the Lion – Forest Crossing</title>
<style>
  body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
    color: #fff;
  }
  canvas {
    background: #87ceeb;
    border: 2px solid #fff;
  }
  #ui {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    font-size: 18px;
  }
  .btn {
    position: fixed;
    bottom: 20px;
    background: #333;
    color: #fff;
    padding: 10px 15px;
    border-radius: 6px;
    user-select: none;
    cursor: pointer;
  }
  #btn-left { left: 20px; }
  #btn-right { left: 120px; }
  #btn-up { right: 20px; }
  #btn-down { right: 20px; bottom: 80px; }
</style>
</head>
<body>

<div id="ui">
  <div id="score">Score: 0</div>
  <div id="status">Leonard the Lion – Forest Crossing</div>
</div>

<div id="btn-left" class="btn">◀</div>
<div id="btn-right" class="btn">▶</div>
<div id="btn-up" class="btn">▲</div>
<div id="btn-down" class="btn">▼</div>

<canvas id="game" width="480" height="640"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");

const TILE = 40;
const COLS = canvas.width / TILE;
const ROWS = canvas.height / TILE;

const TERRAIN = {
  GRASS: "grass",
  WATER: "water",
  TREE: "tree",
  LOG: "log"
};

const OBST = {
  BOAR: "boar",
  DEER: "deer",
  MOVING_LOG: "moving_log"
};

let rows = [];
let obstacles = [];
let logLanes = {}; // unified moving log lanes
let score = 0;
let gameOver = false;

let leonard = {
  col: Math.floor(COLS / 2),
  row: ROWS - 1,
  x: 0,
  y: 0,
  targetX: 0,
  targetY: 0,
  moving: false,
  moveProgress: 0
};

function initLeonard() {
  leonard.col = Math.floor(COLS / 2);
  leonard.row = ROWS - 1;
  leonard.x = leonard.col * TILE;
  leonard.y = leonard.row * TILE;
  leonard.targetX = leonard.x;
  leonard.targetY = leonard.y;
  leonard.moving = false;
}

function generateGrassRow() {
  const row = new Array(COLS).fill(TERRAIN.GRASS);
  for (let i = 0; i < COLS; i++) {
    if (Math.random() < 0.15) row[i] = TERRAIN.TREE;
  }
  return row;
}

function generateWaterRow(rowIndex) {
  const row = new Array(COLS).fill(TERRAIN.WATER);

  const mode = Math.random() < 0.5 ? "static" : "moving";

  if (mode === "static") {
    for (let i = 0; i < COLS; i++) {
      if (Math.random() < 0.5) row[i] = TERRAIN.LOG;
    }
    if (!row.includes(TERRAIN.LOG)) {
      row[Math.floor(Math.random() * COLS)] = TERRAIN.LOG;
    }
  } else {
    const direction = Math.random() < 0.5 ? 1 : -1;
    const speed = 1.2;
    logLanes[rowIndex] = { direction, speed };
  }

  return row;
}

function generateRow(rowIndex) {
  // Bottom row: guaranteed safe grass, no trees, no water
  if (rowIndex === ROWS - 1) {
    return new Array(COLS).fill(TERRAIN.GRASS);
  }

  const r = Math.random();
  if (r < 0.4) return generateGrassRow();
  if (r < 0.7) return generateWaterRow(rowIndex);
  return new Array(COLS).fill(TERRAIN.GRASS);
}

function createMovingLogs(rowIndex) {
  const lane = logLanes[rowIndex];
  if (!lane) return;

  const logCount = 6;
  for (let i = 0; i < logCount; i++) {
    const length = TILE * (1.2 + Math.random() * 1.5);
    const spacing = 120 + Math.random() * 120;

    obstacles.push({
      type: OBST.MOVING_LOG,
      row: rowIndex,
      x: lane.direction === 1
        ? -TILE - i * spacing
        : canvas.width + TILE + i * spacing,
      y: rowIndex * TILE,
      width: length,
      height: TILE * 0.6,
      speed: lane.speed,
      direction: lane.direction
    });
  }
}

function addAnimalLane(rowIndex) {
  const laneSpeed = 2 + Math.random() * 1.5;
  const direction = Math.random() < 0.5 ? 1 : -1;

  const animalCount = 4;
  for (let i = 0; i < animalCount; i++) {
    const type = Math.random() < 0.5 ? OBST.BOAR : OBST.DEER;

    obstacles.push({
      type,
      row: rowIndex,
      x: direction === 1
        ? -TILE - i * 200
        : canvas.width + TILE + i * 200,
      y: rowIndex * TILE,
      width: TILE * 1.2,
      height: TILE * 0.8,
      speed: laneSpeed,
      direction
    });
  }
}

function generateWorld() {
  rows = [];
  obstacles = [];
  logLanes = {};

  for (let r = 0; r < ROWS; r++) {
    const terrainRow = generateRow(r);
    rows.push(terrainRow);

    if (logLanes[r]) {
      createMovingLogs(r);
    } else if (terrainRow.includes(TERRAIN.WATER)) {
      // static logs only
    } else if (r < ROWS - 2 && Math.random() < 0.5) {
      addAnimalLane(r);
    }
  }
}

function resetGame() {
  score = 0;
  gameOver = false;
  generateWorld();
  initLeonard();
  statusEl.textContent = "Leonard the Lion – Forest Crossing";
}

function moveLeonard(dx, dy) {
  if (gameOver || leonard.moving) return;

  const newCol = leonard.col + dx;
  const newRow = leonard.row + dy;

  if (newCol < 0 || newCol >= COLS || newRow < 0 || newRow >= ROWS) return;

  const terrain = rows[newRow][newCol];
  if (terrain === TERRAIN.TREE) return;

  leonard.col = newCol;
  leonard.row = newRow;
  leonard.targetX = newCol * TILE;
  leonard.targetY = newRow * TILE;
  leonard.moving = true;
  leonard.moveProgress = 0;

  if (dy === -1) {
    score++;
    scoreEl.textContent = "Score: " + score;
  }

  if (newRow === 0) {
    endGame("Leonard made it across the forest!");
  }
}
