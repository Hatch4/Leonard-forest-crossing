<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Leonard the Lion – Forest Crossing</title>
<style>
  body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
    color: #fff;
  }
  canvas {
    background: #87ceeb;
    border: 2px solid #fff;
  }
  #ui {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    font-size: 18px;
  }
  .btn {
    position: fixed;
    bottom: 20px;
    background: #333;
    color: #fff;
    padding: 10px 15px;
    border-radius: 6px;
    user-select: none;
    cursor: pointer;
  }
  #btn-left { left: 20px; }
  #btn-right { left: 120px; }
  #btn-up { right: 20px; }
  #btn-down { right: 20px; bottom: 80px; }
</style>
</head>
<body>

<div id="ui">
  <div id="score">Score: 0</div>
  <div id="status">Leonard the Lion – Forest Crossing</div>
</div>

<div id="btn-left" class="btn">◀</div>
<div id="btn-right" class="btn">▶</div>
<div id="btn-up" class="btn">▲</div>
<div id="btn-down" class="btn">▼</div>

<canvas id="game" width="480" height="640"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");

const TILE = 40;
const COLS = canvas.width / TILE;
const ROWS = canvas.height / TILE;

const TERRAIN = {
  GRASS: "grass",
  WATER: "water",
  TREE: "tree",
  LOG: "log"
};

const OBST = {
  BOAR: "boar",
  DEER: "deer",
  MOVING_LOG: "moving_log"
};

let rows = [];
let obstacles = [];
let logLanes = {}; // unified moving log lanes
let score = 0;
let gameOver = false;

let leonard = {
  col: Math.floor(COLS / 2),
  row: ROWS - 2,
  x: 0,
  y: 0,
  targetX: 0,
  targetY: 0,
  moving: false,
  moveProgress: 0
};

function initLeonard() {
  leonard.col = Math.floor(COLS / 2);
  leonard.row = ROWS - 2;
  leonard.x = leonard.col * TILE;
  leonard.y = leonard.row * TILE;
  leonard.targetX = leonard.x;
  leonard.targetY = leonard.y;
  leonard.moving = false;
}

function generateGrassRow() {
  const row = new Array(COLS).fill(TERRAIN.GRASS);
  for (let i = 0; i < COLS; i++) {
    if (Math.random() < 0.15) row[i] = TERRAIN.TREE;
  }
  return row;
}

function generateWaterRow(rowIndex) {
  const row = new Array(COLS).fill(TERRAIN.WATER);

  const mode = Math.random() < 0.5 ? "static" : "moving";

  if (mode === "static") {
    // Floating logs only
    for (let i = 0; i < COLS; i++) {
      if (Math.random() < 0.5) row[i] = TERRAIN.LOG;
    }
    if (!row.includes(TERRAIN.LOG)) {
      row[Math.floor(Math.random() * COLS)] = TERRAIN.LOG;
    }
  } else {
    // Moving logs only
    const direction = Math.random() < 0.5 ? 1 : -1;
    const speed = 1.2;
    logLanes[rowIndex] = { direction, speed };
  }

  return row;
}

function generateRow(rowIndex) {
  const r = Math.random();
  if (r < 0.4) return generateGrassRow();
  if (r < 0.7) return generateWaterRow(rowIndex);
  return new Array(COLS).fill(TERRAIN.GRASS);
}

function createMovingLogs(rowIndex) {
  const lane = logLanes[rowIndex];
  if (!lane) return;

  for (let i = 0; i < 3; i++) {
    obstacles.push({
      type: OBST.MOVING_LOG,
      row: rowIndex,
      x: lane.direction === 1
        ? -TILE - i * 200
        : canvas.width + TILE + i * 200,
      y: rowIndex * TILE,
      width: TILE * 1.5,
      height: TILE * 0.6,
      speed: lane.speed,
      direction: lane.direction
    });
  }
}

function addMovingObstacle(rowIndex) {
  const type = Math.random() < 0.5 ? OBST.BOAR : OBST.DEER;
  const direction = Math.random() < 0.5 ? 1 : -1;
  const speed = type === OBST.BOAR ? 2.5 : 1.8;

  obstacles.push({
    type,
    row: rowIndex,
    x: direction === 1 ? -TILE : canvas.width + TILE,
    y: rowIndex * TILE,
    width: TILE * 1.2,
    height: TILE * 0.8,
    speed,
    direction
  });
}

function generateWorld() {
  rows = [];
  obstacles = [];
  logLanes = {};

  for (let r = 0; r < ROWS; r++) {
    const terrainRow = generateRow(r);
    rows.push(terrainRow);

    if (logLanes[r]) {
      createMovingLogs(r);
    } else if (terrainRow.includes(TERRAIN.WATER)) {
      // static logs only, no moving logs
    } else if (Math.random() < 0.3 && r < ROWS - 3) {
      addMovingObstacle(r);
    }
  }
}

function resetGame() {
  score = 0;
  gameOver = false;
  generateWorld();
  initLeonard();
  statusEl.textContent = "Leonard the Lion – Forest Crossing";
}

function moveLeonard(dx, dy) {
  if (gameOver || leonard.moving) return;

  const newCol = leonard.col + dx;
  const newRow = leonard.row + dy;

  if (newCol < 0 || newCol >= COLS || newRow < 0 || newRow >= ROWS) return;

  const terrain = rows[newRow][newCol];
  if (terrain === TERRAIN.TREE) return;

  leonard.col = newCol;
  leonard.row = newRow;
  leonard.targetX = newCol * TILE;
  leonard.targetY = newRow * TILE;
  leonard.moving = true;
  leonard.moveProgress = 0;

  if (dy === -1) {
    score++;
    scoreEl.textContent = "Score: " + score;
  }

  if (newRow === 0) {
    endGame("Leonard made it across the forest!");
  }
}

window.addEventListener("keydown", (e) => {
  if (gameOver && e.key === "Enter") return resetGame();
  if (e.key === "ArrowLeft") moveLeonard(-1, 0);
  if (e.key === "ArrowRight") moveLeonard(1, 0);
  if (e.key === "ArrowUp") moveLeonard(0, -1);
  if (e.key === "ArrowDown") moveLeonard(0, 1);
});

document.getElementById("btn-left").onclick = () => moveLeonard(-1, 0);
document.getElementById("btn-right").onclick = () => moveLeonard(1, 0);
document.getElementById("btn-up").onclick = () => moveLeonard(0, -1);
document.getElementById("btn-down").onclick = () => moveLeonard(0, 1);

function updateLeonard(dt) {
  if (!leonard.moving) return;

  leonard.moveProgress += dt * 6;

  if (leonard.moveProgress >= 1) {
    leonard.x = leonard.targetX;
    leonard.y = leonard.targetY;
    leonard.moving = false;
    leonard.moveProgress = 0;
  } else {
    leonard.x += (leonard.targetX - leonard.x) * dt * 6;
    leonard.y += (leonard.targetY - leonard.y) * dt * 6;
  }
}

function updateObstacles(dt) {
  for (let o of obstacles) {
    o.x += o.speed * o.direction;

    if (o.type === OBST.MOVING_LOG && leonard.row === o.row) {
      const lane = logLanes[o.row];
      const lx = leonard.x + TILE * 0.5;

      if (lx > o.x && lx < o.x + o.width) {
        leonard.x += lane.speed * lane.direction;
        leonard.targetX = leonard.x;
      }
    }
  }

  obstacles = obstacles.filter(o => o.x > -200 && o.x < canvas.width + 200);
}

function checkCollisions() {
  const terrain = rows[leonard.row][leonard.col];

  if (terrain === TERRAIN.WATER) {
    let onLog = false;

    if (logLanes[leonard.row]) {
      // moving log lane
      for (let o of obstacles) {
        if (o.type === OBST.MOVING_LOG && o.row === leonard.row) {
          if (leonard.x + TILE * 0.5 > o.x &&
              leonard.x + TILE * 0.5 < o.x + o.width) {
            onLog = true;
          }
        }
      }
    } else {
      // static logs
      if (rows[leonard.row][leonard.col] === TERRAIN.LOG) {
        onLog = true;
      }
    }

    if (!onLog) endGame("Leonard fell into the river!");
  }

  for (let o of obstacles) {
    if (o.row !== leonard.row) continue;

    const lx = leonard.x + TILE * 0.1;
    const ly = leonard.y + TILE * 0.1;
    const lw = TILE * 0.8;
    const lh = TILE * 0.8;

    if (lx < o.x + o.width &&
        lx + lw > o.x &&
        ly < o.y + o.height &&
        ly + lh > o.y) {
      if (o.type === OBST.BOAR) endGame("A boar knocked Leonard over!");
      else if (o.type === OBST.DEER) endGame("Leonard was trampled by a deer!");
    }
  }
}

function endGame(msg) {
  gameOver = true;
  statusEl.textContent = msg + " Press Enter to restart.";
}

function drawTerrain() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = rows[r][c];
      const x = c * TILE;
      const y = r * TILE;

      if (t === TERRAIN.GRASS) {
        ctx.fillStyle = "#4caf50";
        ctx.fillRect(x, y, TILE, TILE);
      } else if (t === TERRAIN.WATER) {
        ctx.fillStyle = "#1e88e5";
        ctx.fillRect(x, y, TILE, TILE);
      } else if (t === TERRAIN.TREE) {
        ctx.fillStyle = "#4caf50";
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#2e7d32";
        ctx.fillRect(x + 8, y + 4, TILE - 16, TILE - 8);
        ctx.fillStyle = "#5d4037";
        ctx.fillRect(x + TILE/2 - 4, y + TILE - 12, 8, 12);
      } else if (t === TERRAIN.LOG) {
        ctx.fillStyle = "#1e88e5";
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#8d6e63";
        ctx.fillRect(x + 4, y + 10, TILE - 8, TILE - 20);
      }
    }
  }
}

function drawObstacles() {
  for (let o of obstacles) {
    if (o.type === OBST.MOVING_LOG) {
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(o.x, o.y + TILE * 0.2, o.width, o.height);
      continue;
    }

    ctx.fillStyle = o.type === OBST.BOAR ? "#6d4c41" : "#a1887f";
    ctx.fillRect(o.x, o.y + TILE * 0.1, o.width, o.height);

    ctx.fillStyle = "#3e2723";
    ctx.fillRect(o.x + o.width * 0.6, o.y, o.width * 0.3, o.height * 0.6);
  }
}

function drawLeonard() {
  ctx.fillStyle = "#ffb74d";
  ctx.fillRect(leonard.x + 8, leonard.y + 8, TILE - 16, TILE - 16);

  ctx.fillStyle = "#f57c00";
  ctx.fillRect(leonard.x + 4, leonard.y + 4, TILE - 8, TILE - 8);

  ctx.fillStyle = "#ffe0b2";
  ctx.fillRect(leonard.x + 12, leonard.y + 12, TILE - 24, TILE - 24);

  ctx.fillStyle = "#000";
  ctx.fillRect(leonard.x + 16, leonard.y + 18, 4, 4);
  ctx.fillRect(leonard.x + TILE - 20, leonard.y + 18, 4, 4);
}

let lastTime = 0;
function loop(ts) {
  const dt = (ts - lastTime) / 1000;
  lastTime = ts;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!gameOver) {
    updateLeonard(dt);
    updateObstacles(dt);
    checkCollisions();
  }

  drawTerrain();
  drawObstacles();
  drawLeonard();

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
